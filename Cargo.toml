[package]
name = "hitpad-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.8", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1.1.0"
defmt-rtt = { version = "1.2.0", features = ["disable-blocking-mode"] }
embassy-executor = { version = "0.10.0", features = ["defmt", "platform-cortex-m", "executor-thread", "nightly"] }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32h7r3z8", "unstable-pac", "time-driver-any"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-1_000_000"] }
embassy-usb = { version = "0.6.0", features = ["defmt", "usbd-hid", "max-interface-count-3", "max-handler-count-3"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
portable-atomic = { version = "1.13", features = ["critical-section"] }
static_cell = "2.1.1"
usbd-hid = "0.10.0"
bitflags = "2.11.1"
embassy-usb-driver = { version = "0.2.2", features = ["defmt"] }
embassy-usb-synopsys-otg = { path = "./embassy-usb-synopsys-otg-0.3.3", features = ["defmt", "host", "dma"] }

[profile.release]
debug = 2
lto = "fat"
opt-level = 3

[profile.dev]
opt-level = "s"
debug-assertions = false
overflow-checks = false
lto = "fat"

[patch.crates-io]
embassy-stm32 = { path = "./embassy-stm32-0.6.0" }
embassy-usb-synopsys-otg = { path = "./embassy-usb-synopsys-otg-0.3.3" }
